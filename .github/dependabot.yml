version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/services/api", "/services/worker", "/services/notifier"]
    schedule: { interval: weekly }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/services/api", "/services/worker", "/services/notifier"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
