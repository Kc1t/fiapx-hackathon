# Infra local + serviços. Valores padrão são só para dev; sobrescreva com .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fiapx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiapx_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fiapx}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiapx}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-fiapx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-fiapx_dev}
    ports: ["15674:5672", "15673:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Storage compatível com S3 (MinIO deixou de publicar imagens públicas; RustFS usa a mesma API S3).
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-fiapx}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-fiapx_dev_secret}
    volumes:
      - storagedata:/data
    ports: ["19000:9000", "19001:9001"]   # API S3 e console web

  mailpit:
    image: axllent/mailpit:latest
    ports: ["11025:1025", "18025:8025"]   # SMTP e interface web

  api:
    build: ./services/api
    environment: { PORT: "8080" }
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    build: ./services/worker
    environment: { PORT: "8081" }
    depends_on:
      rabbitmq: { condition: service_healthy }

  notifier:
    build: ./services/notifier
    environment: { PORT: "8082" }
    depends_on:
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
  storagedata:
